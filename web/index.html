<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Air-Link">
  <meta name="theme-color" content="#242529">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <title>Air-Link</title>
  <style>
    :root {
      --bg: #242529;
      --card: #2c2d32;
      --text: #ffffff;
      --muted: #c4c5c8;
      --accent: #3d8bfd;
      --warn: #2a1518;
      --warn-text: #ffb4b4;
      --ok: #3dd68c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem;
    }
    main {
      width: 100%;
      max-width: 24rem;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      padding: 1.35rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .brand img { width: 36px; height: 36px; display: block; }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 650; }
    .badge {
      display: inline-block;
      margin: 0.35rem 0 0;
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .name {
      font-size: 1.05rem;
      word-break: break-word;
      margin: 0.75rem 0 0.25rem;
      font-weight: 600;
    }
    .size { color: var(--muted); font-size: 0.9rem; margin: 0 0 1rem; }
    #media img, #media video {
      display: block;
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      background: #000;
      border-radius: 10px;
      margin-bottom: 0.85rem;
    }
    #gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
      margin-bottom: 0.85rem;
    }
    .thumb {
      position: relative;
      display: block;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .thumb input {
      position: absolute;
      top: 0.35rem;
      left: 0.35rem;
      width: 1.1rem;
      height: 1.1rem;
      z-index: 1;
    }
    #actions { display: flex; flex-direction: column; gap: 0.5rem; }
    .btn, a.btn {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 0.85rem 1rem;
      font-size: 1.02rem;
      font-weight: 650;
      text-align: center;
      text-decoration: none;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }
    .btn.secondary, a.btn.secondary { background: #3a465c; }
    .hint { margin: 0.15rem 0 0; color: var(--muted); font-size: 0.85rem; }
    #fallback {
      background: var(--warn);
      color: var(--warn-text);
      border-radius: 10px;
      padding: 0.75rem 0.85rem;
      margin: 0 0 0.85rem;
      font-size: 0.88rem;
      line-height: 1.4;
    }
    #fallback strong { color: #ffd0d0; }
    #errors {
      background: var(--warn);
      color: var(--warn-text);
      border-radius: 10px;
      padding: 0.65rem 0.85rem;
      margin: 0.75rem 0 0;
      font-size: 0.8rem;
      white-space: pre-wrap;
    }
    #send-to-pc {
      margin-top: 1.25rem;
      padding-top: 1.1rem;
      border-top: 1px solid #2a3548;
    }
    #send-to-pc h2 {
      margin: 0 0 0.35rem;
      font-size: 1rem;
      font-weight: 650;
    }
    #send-to-pc .hint { margin: 0 0 0.75rem; }
    #send-to-pc textarea {
      width: 100%;
      min-height: 4.5rem;
      margin: 0 0 0.5rem;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      border: 1px solid #3a465c;
      background: #0b0f14;
      color: var(--text);
      font: inherit;
      resize: vertical;
    }
    #send-to-pc .row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #upload-status {
      margin-top: 0.65rem;
      font-size: 0.88rem;
      color: var(--muted);
    }
    #upload-status.ok { color: var(--ok); }
    #upload-status.wait { color: #f0c674; }
    #pin-gate {
      margin: 0 0 1rem;
      padding: 0.85rem;
      border-radius: 12px;
      background: #243044;
    }
    #pin-gate input {
      width: 100%;
      margin: 0.5rem 0;
      padding: 0.75rem;
      font-size: 1.2rem;
      letter-spacing: 0.3em;
      text-align: center;
      border-radius: 10px;
      border: 1px solid #3a465c;
      background: #0b0f14;
      color: var(--text);
    }
  </style>
</head>
<body>
  <main>
    <div id="pin-gate" hidden>
      <label for="pin-input"><strong>Enter PIN</strong></label>
      <p class="hint">The 4-digit code is on the PC window.</p>
      <input id="pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="one-time-code">
      <button type="button" class="btn" id="pin-go">Unlock</button>
      <p class="hint" id="pin-err" role="alert" aria-live="assertive"></p>
    </div>
    <div class="brand">
      <img src="/logomark-transparent.png" alt="">
      <h1>Air-Link</h1>
    </div>
    <p class="badge" id="platform">…</p>
    <p class="name" id="name" aria-live="polite">…</p>
    <p class="size" id="size" aria-live="polite"></p>
    <div id="fallback" hidden>
      <strong>Save tip</strong>
      <div id="fallback-reason"></div>
      <div style="margin-top:0.35rem">On iPhone: long-press image → Save to Photos, or Download then Files → Save Video.</div>
    </div>
    <div id="media"></div>
    <div id="gallery" hidden></div>
    <div id="actions"></div>
    <section id="send-to-pc">
      <h2>Send to PC</h2>
      <p class="hint">Pick photos or files, or paste text — same QR, no extra app.</p>
      <div class="row">
        <input type="file" id="upload-files" multiple accept="image/*,video/*,*/*">
        <textarea id="upload-text" placeholder="Paste text to send to the PC"></textarea>
        <button type="button" class="btn" id="upload-send">Send to PC</button>
      </div>
      <p id="upload-status" hidden aria-live="polite"></p>
    </section>
    <section id="pair-box" hidden>
      <h2>Pair this phone</h2>
      <p class="hint">Scan once, then send from Shortcuts without a new QR.</p>
      <button type="button" class="btn secondary" id="pair-btn">Pair this phone</button>
      <pre id="pair-steps" hidden style="white-space:pre-wrap;word-break:break-all;font-size:0.8rem;background:#0b0f14;padding:0.75rem;border-radius:10px;"></pre>
    </section>
    <div id="errors" hidden role="alert" aria-live="assertive"></div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
