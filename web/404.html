<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#242529">
  <title>Air-Link</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <style>
    :root {
      --bg: #242529;
      --card: #2c2d32;
      --text: #ffffff;
      --muted: #c4c5c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 1.25rem;
    }
    main {
      width: 100%;
      max-width: 24rem;
      margin: 0 auto;
      background: var(--card);
      border-radius: 16px;
      padding: 1.35rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }
    .brand img { width: 36px; height: 36px; display: block; }
    h1 { margin: 0; font-size: 1.15rem; font-weight: 650; }
    p {
      margin: 0.9rem 0 0;
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <img src="/logomark-transparent.png" alt="">
      <h1>Air-Link</h1>
    </div>
    <p>This link has expired or is invalid. Scan the new QR code on your PC.</p>
  </main>
</body>
</html>
